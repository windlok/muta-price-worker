name: Trendyol fiyat kontrolü

on:
  # NOT: GitHub sunucu IP'leri Trendyol tarafından engellendiği için
  # otomatik zamanlama kapatıldı. İleride residential proxy veya ücretli
  # scraping servisi eklenirse 'schedule' bloğu yeniden açılabilir.
  #
  # schedule:
  #   - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      test_urls:
        description: 'Test URL listesi (virgülle ayır, boş = normal çalışma)'
        required: false
        type: string

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Playwright tarayıcı önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Fiyatları kontrol et
        run: node index.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_URLS: ${{ inputs.test_urls }}
